<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1a3cb0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Dono</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="w">
<header class="top"><div class="brand"><span class="logo" id="logo"></span><div><b>Painel do Dono</b><small id="sub"></small></div></div><span class="tag" id="tag">Exemplo</span></header>
<main id="app"></main>
</div>
<button class="fab" id="fab" aria-label="Novo lançamento"></button>
<dialog id="dlg" aria-labelledby="dt"><form id="frm"><h2 id="dt">Novo lançamento</h2>
<div class="seg"><label><input type="radio" name="tipo" value="entrada" checked><span>Entrada</span></label><label><input type="radio" name="tipo" value="saida"><span>Saída</span></label></div>
<div class="seg" id="natw" style="margin-top:12px"><label><input type="radio" name="nat" value="variavel" checked><span>Variável</span></label><label><input type="radio" name="nat" value="fixa"><span>Fixa</span></label></div>
<label class="f">Descrição ou cliente<input name="cliente" required maxlength="80" autocomplete="off"></label>
<label class="f">Categoria ou serviço<input name="servico" list="cats" maxlength="60" autocomplete="off"></label><datalist id="cats"></datalist>
<div class="two"><label class="f">Valor (R$)<input name="valor" type="number" step="0.01" min="0.01" inputmode="decimal" required></label><label class="f">Vencimento<input name="data" type="date" required></label></div>
<label class="f" id="cw">Conta<select name="conta" id="fc"></select></label>
<label class="f">Situação<select name="status"><option value="pago">Já foi pago</option><option value="pendente">Em aberto</option></select></label>
<div id="repw"><label class="f">Repete?<select name="rep"><option value="0">Não repete</option><option value="f">Conta fixa, todo mês</option><option value="p">Parcelado</option></select></label><label class="f" id="qw" hidden>Quantas vezes (parcelas ou meses)<input name="qtd" type="number" min="2" max="60" value="12" inputmode="numeric"></label></div>
<p class="note" id="dn" hidden>Ao salvar, os dados de exemplo serão removidos.</p>
<div class="acts"><button class="btn" type="submit">Salvar</button><button class="btn g" type="button" id="cx">Cancelar</button><button class="btn g del" type="button" id="del" hidden>Excluir</button><button class="btn g del" type="button" id="dall" hidden>Excluir este e os próximos</button></div></form></dialog>
<dialog id="dlc" aria-labelledby="ctt"><form id="frc"><h2 id="ctt">Nova conta</h2>
<label class="f">Nome<input name="nome" required maxlength="40" autocomplete="off" placeholder="Ex.: Nubank, Tesouro Selic"></label>
<label class="f">Tipo<select name="tipo"><option value="corrente">Conta corrente</option><option value="poupanca">Poupança</option><option value="dinheiro">Dinheiro</option><option value="invest">Investimento</option></select></label>
<label class="f">Saldo atual (R$)<input name="saldo" type="number" step="0.01" inputmode="decimal" required></label>
<label class="chk" id="lqw" hidden><input type="checkbox" name="liq"> Resgate imediato (conta como dinheiro disponível)</label>
<div class="acts"><button class="btn" type="submit">Salvar</button><button class="btn g" type="button" id="cxc">Cancelar</button><button class="btn g del" type="button" id="delc" hidden>Excluir</button></div></form></dialog>
<nav class="dock" id="dock" aria-label="Seções"></nav>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="rest" accept=".json,application/json" hidden>
<script src="js/captura.js"></script>
<script src="js/app.js"></script>
</body>
</html>
