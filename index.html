<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a1230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controle financeiro simples: lance entradas e saídas, marque contas como pagas e edite sua planilha direto no celular.">
<title>Painel do Dono</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="w">
<header class="top">
    <div class="brand">
        <span class="logo" id="logo"></span>
        <div><b>Painel do Dono</b><small id="sub">Gestão financeira</small></div>
    </div>
    <a class="gear" id="gear" href="#importar" aria-label="Dados, importar e backup" hidden></a>
</header>
<main id="app"></main>
</div>
<noscript><p style="padding:16px">O Painel do Dono precisa de JavaScript para funcionar.</p></noscript>
<button class="fab" id="fab" data-act="add" aria-label="Novo lançamento" hidden></button>
<nav class="dock" id="dock" aria-label="Seções" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv,.txt" hidden>
<input type="file" id="rest" accept=".json,application/json" hidden>
<script src="js/captura.js"></script>
<script src="js/dados.js"></script>
<script src="js/app.js"></script>
</body>
</html>
